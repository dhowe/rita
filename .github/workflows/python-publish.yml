name: Python Publish

# Publishes rita-py to PyPI when a release tag is pushed.
# Uses PyPI trusted publishing (OIDC), so no API token is stored in the repo:
# add the repository dhowe/rita and this workflow file as a trusted publisher
# on https://pypi.org/manage/project/rita-py/settings/publishing/ .

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        working-directory: python
        run: uv build

      - name: Publish to PyPI
        working-directory: python
        run: uv publish
